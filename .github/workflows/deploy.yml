name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web App
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          touch .env
          URL="${SUPABASE_URL:-https://egsmzfrhekpacpjoxijs.supabase.co}"
          KEY="${SUPABASE_PUBLISHABLE_KEY:-sb_publishable_pdO9X15rs1aobOdydiksWw_URfC684D}"
          flutter build web --release --pwa-strategy=none --dart-define=SUPABASE_URL="$URL" --dart-define=SUPABASE_PUBLISHABLE_KEY="$KEY" --base-href="/thi_nhanh/"
          cp build/web/index.html build/web/404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
